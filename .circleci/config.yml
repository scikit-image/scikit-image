version: 2

jobs:
  doc:
    machine:
      # gen3 resource classes are only valid with the `current` tag, not a
      # pinned dated tag -- a pinned tag is rejected with "is not a valid
      # resource class"
      image: ubuntu-2604:current
    # large.gen3 4 vCPUs 16GiB mem -- gen3 is an open beta, and is both faster
    # and cheaper per minute than gen1 large (14 vs 20 credits/min); revert to
    # `large` if beta queue times or reliability become a problem
    # https://discuss.circleci.com/t/changes-to-remote-docker-reporting-pricing/47759
    resource_class: large.gen3
    steps:
      - checkout
      - run:
          name: Install apt packages
          command: |
            sudo apt-get update
            sudo apt-get install ccache python3-venv
      - run:
          name: Create a virtual environment
          # The system Python is externally managed (PEP 668), so pip refuses
          # to install into it. CircleCI sources $BASH_ENV before every step,
          # so this activates the venv for the rest of the job.
          command: |
            python3 -m venv ~/venv
            echo "source ~/venv/bin/activate" >> $BASH_ENV
      - run:
          name: Concatenate requirement files
          command: cat requirements/*.txt > requirements/all_requirements
      - restore_cache:
          name: restore cached data files
          keys:
            - data-v1-{{ checksum "src/skimage/data/_registry.py" }}
      - restore_cache:
          name: Restore cached pip dependencies
          keys:
            - packages-v1-{{ checksum "requirements/all_requirements" }}
      - restore_cache:
          name: Restore cached build files (ccache)
          keys:
            - ccache-v2-{{ .Branch }}
      - run:
          name: Install dependencies and build package
          command: |
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements/build.txt
            python3 -m pip install -vv --no-build-isolation .
            # Ensure build succeeds without runtime requirements
            python3 -m pip install -r requirements/default.txt
            python3 -m pip install -r requirements/docs.txt
      - run:
          name: Install Chrome for kaleido
          # Installs via apt like test-docs.yaml (see there for why). This
          # image preconfigures a google-chrome source without Signed-By,
          # which conflicts with the signed one below, so remove it first.
          command: |
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
              [ -f "$f" ] && sudo sed -i '\#dl\.google\.com/linux/chrome/deb#d' "$f"
            done
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
              | gpg --dearmor \
              | sudo tee /usr/share/keyrings/google-chrome.gpg >/dev/null
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
      - run:
          name: Print ccache performance
          command: |
            ccache -s
      - save_cache:
          name: Cache pip dependencies
          key: packages-v1-{{ checksum "requirements/all_requirements" }}
          paths:
            - ~/.cache/pip
      - save_cache:
          name: Cache build files (ccache)
          key: ccache-v2-{{ .Branch }}
          paths:
            - ~/.cache/ccache
      - run:
          name: Build doc
          no_output_timeout: 50m
          command: |
            cd doc
            PYTHON=python3 make clean
            PYTHON=python3 make html
      - save_cache:
          name: Cache data files
          key: data-v1-{{ checksum "src/skimage/data/_registry.py" }}
          paths:
            - /home/circleci/.cache/scikit-image/master
      - store_artifacts:
          path: doc/build/html

workflows:
  version: 2
  build-doc:
    jobs:
      - doc
