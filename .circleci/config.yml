version: 2

jobs:
  doc:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Install apt packages
          command: |
            sudo apt-get update
            sudo apt-get install ccache
      - run:
          name: Concatenate requirement files
          command: cat requirements/*.txt > requirements/all_requirements
      - restore_cache:
          name: restore cached data files
          keys:
            - data-v1-{{ checksum "src/skimage/data/_registry.py" }}
      - restore_cache:
          name: Restore cached pip dependencies
          keys:
            - packages-v1-{{ checksum "requirements/all_requirements" }}
      - restore_cache:
          name: Restore cached build files (ccache)
          keys:
            - ccache-v2-{{ .Branch }}
      - run:
          name: Install dependencies and build package
          command: |
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements/build.txt
            python3 -m pip install -vv --no-build-isolation .
            # Ensure build succeeds without runtime requirements
            python3 -m pip install -r requirements/default.txt
            python3 -m pip install -r requirements/docs.txt
      - run:
          name: Install Chrome for kaleido
          # See .github/workflows/test-docs.yaml for why this installs
          # Chrome through apt instead of `plotly_get_chrome`. This machine
          # image already has a google-chrome apt source configured under a
          # different (or no) Signed-By, so only add our own if none exists;
          # a second, conflicting definition for the same repo breaks `apt-get
          # update` outright ("Conflicting values set for option Signed-By").
          command: |
            if ! grep -qr "dl.google.com/linux/chrome/deb" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
              wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/google-chrome.gpg >/dev/null
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
                | sudo tee /etc/apt/sources.list.d/google-chrome.list
            fi
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
      - run:
          name: Print ccache performance
          command: |
            ccache -s
      - save_cache:
          name: Cache pip dependencies
          key: packages-v1-{{ checksum "requirements/all_requirements" }}
          paths:
            - ~/.cache/pip
      - save_cache:
          name: Cache build files (ccache)
          key: ccache-v2-{{ .Branch }}
          paths:
            - ~/.cache/ccache
      - run:
          name: Build doc
          no_output_timeout: 50m
          command: |
            cd doc
            PYTHON=python3 make clean
            PYTHON=python3 SPHINXOPTS="-j 1" make html
      - save_cache:
          name: Cache data files
          key: data-v1-{{ checksum "src/skimage/data/_registry.py" }}
          paths:
            - /home/circleci/.cache/scikit-image/master
      - store_artifacts:
          path: doc/build/html

workflows:
  version: 2
  build-doc:
    jobs:
      - doc
