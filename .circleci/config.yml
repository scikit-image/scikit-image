version: 2

jobs:
  doc:
    machine:
      # gen3 needs the `current` tag; a pinned dated tag is rejected
      image: ubuntu-2604:current
    # 4 vCPUs/16GiB; gen3 is beta, but faster and cheaper than gen1 `large`
    resource_class: large.gen3
    steps:
      - checkout
      - run:
          name: Install apt packages
          command: |
            sudo apt-get update
            sudo apt-get install ccache python3-venv
      - run:
          name: Set up the build environment
          # $BASH_ENV is sourced before every step. The venv is needed because
          # the system Python is PEP 668-managed; CCACHE_DIR is pinned because
          # ccache only defaults there when the legacy ~/.ccache is absent.
          command: |
            python3 -m venv ~/venv
            echo "source ~/venv/bin/activate" >> $BASH_ENV
            echo "export CCACHE_DIR=$HOME/.cache/ccache" >> $BASH_ENV
      - run:
          name: Concatenate requirement files
          command: cat requirements/*.txt > requirements/all_requirements
      - restore_cache:
          name: restore cached data files
          keys:
            - data-v1-{{ checksum "src/skimage/data/_registry.py" }}
      - restore_cache:
          name: Restore cached uv dependencies
          # Caches are immutable, so the fallback is what keeps this warm
          # when the requirements change.
          keys:
            - uv-v1-{{ checksum "requirements/all_requirements" }}
            - uv-v1-
      - restore_cache:
          name: Restore cached build files (ccache)
          # Revision in the save key so each run writes a fresh cache; the
          # fallbacks warm-start a new branch.
          keys:
            - ccache-v3-{{ .Branch }}-{{ .Revision }}
            - ccache-v3-{{ .Branch }}-
            - ccache-v3-main-
            - ccache-v3-
      - run:
          name: Install dependencies and build package
          command: |
            python3 -m pip install --upgrade pip uv
            # so the stats below describe this run, not the restored cache
            ccache --zero-stats
            uv pip install -r requirements/build.txt
            uv pip install --no-build-isolation .
            # Ensure build succeeds without runtime requirements
            uv pip install -r requirements/default.txt
            uv pip install -r requirements/docs.txt
      - run:
          name: Install Chrome for kaleido
          # Installs via apt like test-docs.yaml (see there for why). This
          # image preconfigures a google-chrome source without Signed-By,
          # which conflicts with the signed one below, so remove it first.
          command: |
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
              [ -f "$f" ] && sudo sed -i '\#dl\.google\.com/linux/chrome/deb#d' "$f"
            done
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
              | gpg --dearmor \
              | sudo tee /usr/share/keyrings/google-chrome.gpg >/dev/null
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
      - run:
          name: Print ccache performance
          command: |
            ccache -s
      - save_cache:
          name: Cache uv dependencies
          key: uv-v1-{{ checksum "requirements/all_requirements" }}
          paths:
            - ~/.cache/uv
      - save_cache:
          name: Cache build files (ccache)
          key: ccache-v3-{{ .Branch }}-{{ .Revision }}
          paths:
            - ~/.cache/ccache
      - run:
          name: Build doc
          no_output_timeout: 50m
          command: |
            cd doc
            PYTHON=python3 make clean
            PYTHON=python3 make html
      - save_cache:
          name: Cache data files
          key: data-v1-{{ checksum "src/skimage/data/_registry.py" }}
          paths:
            - /home/circleci/.cache/scikit-image/master
      - store_artifacts:
          path: doc/build/html

workflows:
  version: 2
  build-doc:
    jobs:
      - doc
