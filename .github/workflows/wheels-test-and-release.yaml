name: Release wheels
# Workflow to build wheels and publish to PyPI if tagged

on:
  push:
    tags:
      - v*
    branches:
      - maintenance/**
  pull_request:
    paths:
      - ".github/workflows/wheels-test-and-release.yaml"
      - ".github/workflows/wheels-recipe.yaml"

concurrency:
  # Cancel previous workflows on the same branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  call-workflow-build-wheels:
    name: Wheels recipe
    uses: ./.github/workflows/wheels-recipe.yaml

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      attestations: write # for GitHub attestations
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          attest-build-provenance-github: ${{ github.event_name == 'push' && 'true' || 'false' }}
          skip-wheel: "true"

  deploy:
    name: Release
    needs: [call-workflow-build-wheels, build_sdist]
    if: github.repository_owner == 'scikit-image' && startsWith(github.ref, 'refs/tags/v') && always()
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        id: download
        with:
          pattern: wheels-*
          merge-multiple: true
          path: ./dist

      - uses: actions/download-artifact@v8
        id: download-sdist
        with:
          name: Packages
          path: ./dist

      - name: Remove distributions that PyPI doesn't support
        run: |
          find ./dist -name '*wasm32.whl' -delete -print
          echo "::notice::Remaining distributions to upload"
          ls -Al ./dist

      # We prefer to release wheels before source because otherwise there is a
      # small window during which users who pip install scikit-image will require compilation.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Github release
        # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
