name: Build on Linux for a given Python version
# Also use ccache as much as possible.

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-latest
      PIP_FLAGS:
        required: false
        type: string
        default: ""

jobs:
  build-skimage-spin:
    name: linux-cp${{ inputs.python-version }}
    runs-on: ${{ inputs.runner }}

    env:
      CCACHE_BASEDIR: "${{ github.workspace }}"
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_MAXSIZE: 400M
      CCACHE_SLOPPINESS: "pch_defines,time_macros"

    steps:
      - name: Verify ARM64 runner
        if: ${{ inputs.runner == 'ubuntu-24.04-arm' }}
        run: test "$(uname -m)" = aarch64

      - name: Checkout scikit-image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          allow-prereleases: true
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install build dependencies
        env:
          PIP_FLAGS: ${{ inputs.PIP_FLAGS }}
        run: |
          source .github/scripts/setup-build-env.sh

      - name: Install and configure ccache
        run: |
          sudo apt-get install -y ccache
          sudo /usr/sbin/update-ccache-symlinks
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: Restore/save ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-py${{ inputs.python-version }}-

      - name: Zero ccache stats
        run: ccache --zero-stats

      - name: Build wheel
        run: |
          python -m build --no-isolation --skip-dependency-check -Csetup-args="-Doptimization=2"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skimage-linux-${{ inputs.python-version }}-${{ runner.arch }}
          path: |
            ./dist/*.whl
            ./dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
