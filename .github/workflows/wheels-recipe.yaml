name: Wheels recipe
# Reusable workflow for building scikit-image's wheels

on:
  workflow_call:
    inputs:
      exclude_v2:
        description: Exclude the skimage2 namespace from the built wheels
        type: boolean
        default: false

permissions:
  contents: read

env:
  COLUMNS: 120
  CIBW_CONFIG_SETTINGS: ${{ inputs.exclude_v2 && 'setup-args=-Dexclude-v2=true' || '' }}

jobs:
  build_macos_wheel:
    name: Build ${{ matrix.build }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [
            macos-15-intel,
            macos-latest, # ARM-version of MacOS
          ]
        build: ["cp312*", "cp313*", "cp314*", "cp315*"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: ${{ matrix.build }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ github.job }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_windows_wheel:
    name: Build ${{ matrix.build }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        build: ["cp312*", "cp313*", "cp314*", "cp315*"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up LLVM toolchain for Windows ARM64
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/windows_arm64_steps
      # Wheel repair is disabled for Windows in pyproject.toml; see the comment
      # on repair-wheel-command under [tool.cibuildwheel.windows].
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CC: clang-cl
          CXX: clang-cl
          LDFLAGS: "-Wl,-S"
          CIBW_SKIP: "*-win32" # not provide 32 bits wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ github.job }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wheel_linux:
    name: Build ${{ matrix.build }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm]
        build:
          [
            "cp312*manylinux*",
            "cp313*manylinux*",
            "cp314*manylinux*",
            "cp315*manylinux*",
            "cp312*musllinux*",
            "cp313*musllinux*",
            "cp314*musllinux*",
            "cp315*musllinux*",
          ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_BUILD: ${{ matrix.build }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}-${{ github.job }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_pyodide_wheel:
    name: Build pyodide on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test scikit-image for Pyodide
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        env:
          CIBW_PLATFORM: pyodide
          # cp313 only: skip cp314+ (pyodide 3.15 is 315.0.0a2 prerelease, not production)
          CIBW_BUILD: "cp313-pyodide_wasm32"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-pyodide-${{ github.job }}
          path: ./wheelhouse/*.whl
