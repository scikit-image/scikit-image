name: Milestone

on:
  push:
    branches:
      - "main"

permissions: {}

jobs:
  milestone_pr:
    name: attach to PR
    if: github.repository == 'scikit-image/scikit-image'
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: scientific-python/attach-next-milestone-action@796cfa44ba1e1a9a4bce7896241d4612a3f06327
        with:
          token: ${{ github.token }}
          force: true
