name: Milestone

on:
  push:
    branches:
      - "main"

permissions: {}

jobs:
  milestone_pr:
    name: attach to PR
    if: github.repository == 'scikit-image/scikit-image'
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: scientific-python/attach-next-milestone-action@8977f3df70982e1dbacee02026cbbfa64d46aa75 # v0.1.0
        with:
          token: ${{ github.token }}
          force: true
