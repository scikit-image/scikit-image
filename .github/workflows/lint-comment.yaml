name: Lint comment
on: # zizmor: ignore[dangerous-triggers] -- no PR code is checked out
  workflow_run:
    workflows: [Lint]
    types: [completed]

permissions:
  pull-requests: write

# Runs in the base repository, so the token can write to PRs from forks.
# Never check out or execute PR code in this workflow.
jobs:
  comment:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Link failed lint run on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open")][0].number')
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "No open PR found for $HEAD_SHA"
            exit 0
          fi
          gh pr comment "$pr" --repo "$REPO" \
            --body "Lint failed. See the log: $RUN_URL"
