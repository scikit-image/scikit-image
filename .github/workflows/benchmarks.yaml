name: Benchmark

on:
  pull_request:
    types: [labeled]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Cancel previous workflows of the same PR, but only for PRs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-commits:
    if: >-
      contains(github.event.label.name, 'benchmark') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      baseline_sha: ${{ steps.commits.outputs.baseline_sha }}
      baseline_label: ${{ steps.commits.outputs.baseline_label }}
      contender_label: ${{ steps.commits.outputs.contender_label }}
      asv_factor: ${{ steps.commits.outputs.asv_factor }}
      asv_processes: ${{ steps.commits.outputs.asv_processes }}
    steps:
      # We need the full repo to avoid this issue
      # https://github.com/actions/checkout/issues/23
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine comparison commits
        id: commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_LABEL: ${{ github.event.pull_request.base.label }}
          PR_HEAD_LABEL: ${{ github.event.pull_request.head.label }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "pull_request" ]; then
            baseline_sha="$PR_BASE_SHA"
            baseline_label="$PR_BASE_LABEL"
            contender_label="$PR_HEAD_LABEL"
            asv_factor="1.5"
            asv_processes="2"
          elif [ "$EVENT_NAME" = "push" ]; then
            before="$PUSH_BEFORE_SHA"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              before=$(git rev-parse "$GITHUB_SHA~1")
            fi
            baseline_sha="$before"
            baseline_label="$before"
            contender_label="$GITHUB_SHA"
            asv_factor="3.0"
            # Unattended merge check: trade some statistical robustness for
            # a much shorter run (single round instead of asv's default of
            # two), offset by the higher noise-tolerant factor above.
            asv_processes="1"
          else
            baseline_sha=$(git rev-parse "$GITHUB_SHA~1")
            baseline_label="$baseline_sha"
            contender_label="$GITHUB_SHA"
            asv_factor="1.5"
            asv_processes="2"
          fi
          echo "baseline_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "baseline_label=$baseline_label" >> "$GITHUB_OUTPUT"
          echo "contender_label=$contender_label" >> "$GITHUB_OUTPUT"
          echo "asv_factor=$asv_factor" >> "$GITHUB_OUTPUT"
          echo "asv_processes=$asv_processes" >> "$GITHUB_OUTPUT"

  # Build the baseline and contender wheels in parallel, reusing the
  # repo's proven, ccache-tuned build workflow instead of asv's own
  # from-scratch (and much slower, sequential) build_command.
  build-baseline:
    needs: resolve-commits
    uses: ./.github/workflows/_build_linux_for_python_x.yaml
    with:
      python-version: "3.12"
      ref: ${{ needs.resolve-commits.outputs.baseline_sha }}
      artifact-name: benchmark-wheel-baseline

  build-contender:
    needs: resolve-commits
    uses: ./.github/workflows/_build_linux_for_python_x.yaml
    with:
      python-version: "3.12"
      ref: ${{ github.sha }}
      artifact-name: benchmark-wheel-contender

  benchmark:
    needs: [resolve-commits, build-baseline, build-contender]
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # We need the full repo to avoid this issue
      # https://github.com/actions/checkout/issues/23
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install asv
        run: pip install asv

      - name: Download baseline wheel
        uses: actions/download-artifact@v4
        with:
          name: benchmark-wheel-baseline
          path: .benchmark-wheels/${{ needs.resolve-commits.outputs.baseline_sha }}

      - name: Download contender wheel
        uses: actions/download-artifact@v4
        with:
          name: benchmark-wheel-contender
          path: .benchmark-wheels/${{ github.sha }}

      - name: Run benchmarks
        shell: bash
        id: benchmark
        env:
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          # asv installs each matrix requirement via its own separate pip
          # invocation; prefer an existing wheel over a much slower source
          # build if a package's very latest release doesn't have full
          # wheel coverage yet.
          PIP_PREFER_BINARY: 1
          ASV_FACTOR: "${{ needs.resolve-commits.outputs.asv_factor }}"
          ASV_PROCESSES: "${{ needs.resolve-commits.outputs.asv_processes }}"
          ASV_SKIP_SLOW: 1
          # Escape user controlled variables
          BASELINE_SHA: "${{ needs.resolve-commits.outputs.baseline_sha }}"
          BASELINE_LABEL: "${{ needs.resolve-commits.outputs.baseline_label }}"
          CONTENDER_LABEL: "${{ needs.resolve-commits.outputs.contender_label }}"
        run: |
          set -x

          python -m pip install virtualenv

          # ID this runner
          asv machine --yes

          echo "Baseline: $BASELINE_SHA ($BASELINE_LABEL)"
          echo "Contender: $GITHUB_SHA ($CONTENDER_LABEL)"

          # Run benchmarks for current commit against base
          ASV_OPTIONS="--split --show-stderr --factor $ASV_FACTOR -a processes=$ASV_PROCESSES"
          asv continuous $ASV_OPTIONS $BASELINE_SHA $GITHUB_SHA \
              | sed "/Traceback \|failed$\|PERFORMANCE DECREASED/ s/^/::error::/" \
              | tee benchmarks.log
          asv_status=${PIPESTATUS[0]}

          # Report and export results for subsequent steps
          if [ "$asv_status" -ne 0 ] || grep "Traceback \|failed\|PERFORMANCE DECREASED" benchmarks.log > /dev/null ; then
              exit 1
          fi

      - name: Add instructions to artifact
        if: always()
        run: |
          mkdir -p .asv/results
          cp benchmarks/README_CI.md benchmarks.log .asv/results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asv-benchmark-results-${{ runner.os }}
          path: .asv/results

      - name: "Job has failed: reporting"
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: "benchmark"
        with:
          filename: .github/MAIN_FAIL_TEMPLATE.md
          update_existing: true
