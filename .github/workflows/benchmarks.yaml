name: Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Full, untrimmed benchmark suite nightly - see the "schedule" branch
    # in .github/scripts/resolve-benchmark-commits.sh.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  # Cancel previous workflows of the same PR, but only for PRs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-commits:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the nightly-baseline `gh run list` lookup in
      # resolve-benchmark-commits.sh (event_name == 'schedule').
      actions: read
    outputs:
      should_run: ${{ steps.commits.outputs.should_run }}
      baseline_sha: ${{ steps.commits.outputs.baseline_sha }}
      baseline_label: ${{ steps.commits.outputs.baseline_label }}
      contender_label: ${{ steps.commits.outputs.contender_label }}
      asv_factor: ${{ steps.commits.outputs.asv_factor }}
      asv_processes: ${{ steps.commits.outputs.asv_processes }}
      asv_skip_slow: ${{ steps.commits.outputs.asv_skip_slow }}
      asv_full_params: ${{ steps.commits.outputs.asv_full_params }}
      bench_filter: ${{ steps.commits.outputs.bench_filter }}
    steps:
      # We need the full repo to avoid this issue
      # https://github.com/actions/checkout/issues/23
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine comparison commits
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_LABEL: ${{ github.event.pull_request.base.label }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_LABEL: ${{ github.event.pull_request.head.label }}
        run: bash .github/scripts/resolve-benchmark-commits.sh

  # Build the baseline and contender wheels in parallel, reusing the
  # repo's proven, ccache-tuned build workflow instead of asv's own
  # from-scratch (and much slower, sequential) build_command.
  build-baseline:
    needs: resolve-commits
    if: needs.resolve-commits.outputs.should_run == 'true'
    uses: ./.github/workflows/_build_linux_for_python_x.yaml
    with:
      python-version: "3.12"
      ref: ${{ needs.resolve-commits.outputs.baseline_sha }}
      artifact-name: benchmark-wheel-baseline

  build-contender:
    needs: resolve-commits
    if: needs.resolve-commits.outputs.should_run == 'true'
    uses: ./.github/workflows/_build_linux_for_python_x.yaml
    with:
      python-version: "3.12"
      ref: ${{ github.sha }}
      artifact-name: benchmark-wheel-contender

  benchmark:
    needs: [resolve-commits, build-baseline, build-contender]
    if: needs.resolve-commits.outputs.should_run == 'true'
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # We need the full repo to avoid this issue
      # https://github.com/actions/checkout/issues/23
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install asv
        run: pip install asv

      - name: Download baseline wheel
        uses: actions/download-artifact@v4
        with:
          name: benchmark-wheel-baseline
          path: .benchmark-wheels/${{ needs.resolve-commits.outputs.baseline_sha }}

      - name: Download contender wheel
        uses: actions/download-artifact@v4
        with:
          name: benchmark-wheel-contender
          path: .benchmark-wheels/${{ github.sha }}

      - name: Run benchmarks
        shell: bash
        id: benchmark
        env:
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          PYTHONUNBUFFERED: 1
          # asv installs each matrix requirement with its own separate pip
          # invocation; prefer an existing wheel over a much slower source
          # build if a package's very latest release doesn't have full
          # wheel coverage yet.
          PIP_PREFER_BINARY: 1
          ASV_FACTOR: "${{ needs.resolve-commits.outputs.asv_factor }}"
          ASV_PROCESSES: "${{ needs.resolve-commits.outputs.asv_processes }}"
          ASV_SKIP_SLOW: "${{ needs.resolve-commits.outputs.asv_skip_slow }}"
          ASV_FULL_PARAMS: "${{ needs.resolve-commits.outputs.asv_full_params }}"
          # Escape user controlled variables
          BASELINE_SHA: "${{ needs.resolve-commits.outputs.baseline_sha }}"
          BASELINE_LABEL: "${{ needs.resolve-commits.outputs.baseline_label }}"
          CONTENDER_LABEL: "${{ needs.resolve-commits.outputs.contender_label }}"
          BENCH_FILTER: "${{ needs.resolve-commits.outputs.bench_filter }}"
        run: bash .github/scripts/run-benchmarks.sh

      - name: Add instructions to artifact
        if: always()
        run: |
          mkdir -p .asv/results
          cp benchmarks/README_CI.md benchmarks.log .asv/results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asv-benchmark-results-${{ runner.os }}
          path: .asv/results

      - name: "Job has failed: reporting"
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: "benchmark"
        with:
          filename: .github/MAIN_FAIL_TEMPLATE.md
          update_existing: true
