name: Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Full, untrimmed benchmark suite nightly. See the "schedule" branch
    # in .github/scripts/resolve-benchmark-params.py.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline commit to compare against"
        required: false
        type: choice
        default: parent-commit
        options:
          - parent-commit
          - previous-nightly

concurrency:
  # Cancel a previous run of the same PR; non-PR runs group by SHA, so each run is a fresh group.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-params:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the nightly-baseline `gh run list` lookup in
      # resolve-benchmark-params.py (event_name == 'schedule').
      actions: read
    outputs:
      should_run: ${{ steps.params.outputs.should_run }}
      python_version: ${{ steps.params.outputs.python_version }}
      baseline_sha: ${{ steps.params.outputs.baseline_sha }}
    steps:
      # Full-checkout needed to avoid this issue:
      # https://github.com/actions/checkout/issues/23
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads GITHUB_EVENT_PATH itself, so pull_request/workflow_dispatch
      # fields don't need repeating in `env:`.
      - name: Resolve benchmark parameters
        id: params
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/resolve-benchmark-params.py

      - uses: actions/upload-artifact@v4
        if: steps.params.outputs.should_run == 'true'
        with:
          name: benchmark-params
          path: benchmark-params.json

  # Build the baseline and contender wheels in parallel, reusing the repo's
  # proven, ccache-tuned build workflow instead of asv's own from-scratch
  # (and much slower, sequential) build_command.
  build-baseline:
    needs: resolve-params
    if: needs.resolve-params.outputs.should_run == 'true'
    uses: ./.github/workflows/_build_linux_for_python_x.yaml
    with:
      python-version: ${{ needs.resolve-params.outputs.python_version }}
      ref: ${{ needs.resolve-params.outputs.baseline_sha }}
      artifact-name: benchmark-wheel-baseline

  build-contender:
    needs: resolve-params
    if: needs.resolve-params.outputs.should_run == 'true'
    uses: ./.github/workflows/_build_linux_for_python_x.yaml
    with:
      python-version: ${{ needs.resolve-params.outputs.python_version }}
      ref: ${{ github.sha }}
      artifact-name: benchmark-wheel-contender

  benchmark:
    needs: [resolve-params, build-baseline, build-contender]
    if: needs.resolve-params.outputs.should_run == 'true'
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      # Full-checkout needed to avoid this issue:
      # https://github.com/actions/checkout/issues/23
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: ${{ needs.resolve-params.outputs.python_version }}
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install asv
        run: pip install asv

      - name: Download baseline wheel
        uses: actions/download-artifact@v4
        with:
          name: benchmark-wheel-baseline
          path: .benchmark-wheels/${{ needs.resolve-params.outputs.baseline_sha }}

      - name: Download contender wheel
        uses: actions/download-artifact@v4
        with:
          name: benchmark-wheel-contender
          path: .benchmark-wheels/${{ github.sha }}

      - name: Download benchmark parameters
        uses: actions/download-artifact@v4
        with:
          name: benchmark-params

      - name: Prepare benchmarks
        run: bash .github/scripts/prepare-benchmarks.sh

      - name: Run benchmarks
        shell: bash
        id: benchmark
        run: bash .github/scripts/run-benchmarks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asv-benchmark-results-${{ runner.os }}
          path: .asv/results

      - name: "Job has failed: reporting"
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: "benchmark"
        with:
          filename: .github/MAIN_FAIL_TEMPLATE.md
          update_existing: true
