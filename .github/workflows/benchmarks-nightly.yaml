name: Benchmark (nightly)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  benchmark:
    name: Linux
    runs-on: ubuntu-latest
    env:
      CCACHE_BASEDIR: "${{ github.workspace }}"
      CCACHE_DIR: "${{ github.workspace }}/.ccache"
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 6
      CCACHE_MAXSIZE: 400M

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install asv and virtualenv
        shell: bash
        run: pip install asv virtualenv

      - name: Setup ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-nightly-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-nightly-${{ runner.os }}-

      - name: Restore asv state
        id: asv-state
        uses: actions/cache@v4
        with:
          path: |
            .asv/env
            .asv/results
            last_contender_sha
          key: nightly-benchmark-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nightly-benchmark-${{ runner.os }}-

      - name: Run benchmarks
        id: benchmark
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
          OMP_NUM_THREADS: 1
          ASV_SKIP_SLOW: 1
        run: |
          set -x

          asv machine --yes

          CONTENDER_SHA="$GITHUB_SHA"
          BASELINE_SHA=""
          if [[ -f last_contender_sha ]]; then
            BASELINE_SHA="$(cat last_contender_sha)"
          fi

          echo "Contender: $CONTENDER_SHA"
          echo "Baseline: ${BASELINE_SHA:-<none>}"

          if [[ -z "$BASELINE_SHA" ]]; then
            # First run or cache evicted: record only, no comparison.
            asv run "$CONTENDER_SHA" --show-stderr | tee benchmarks.log
            if grep "Traceback \|failed\|PERFORMANCE DECREASED" benchmarks.log > /dev/null; then
              exit 1
            fi
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          asv continuous --split --show-stderr --factor 1.1 \
              "$BASELINE_SHA" "$CONTENDER_SHA" \
              | sed "/Traceback \|failed$\|PERFORMANCE DECREASED/ s/^/::error::/" \
              | tee benchmarks.log

          if grep "Traceback \|failed\|PERFORMANCE DECREASED" benchmarks.log > /dev/null; then
            exit 1
          fi

      - name: Advance baseline on clean run
        if: success() && steps.benchmark.outputs.has_baseline != 'false'
        shell: bash
        run: echo "$GITHUB_SHA" > last_contender_sha

      - name: Record baseline for first run
        if: success() && steps.benchmark.outputs.has_baseline == 'false'
        shell: bash
        run: echo "$GITHUB_SHA" > last_contender_sha

      - name: Check ccache performance
        if: always()
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ccache -s

      - name: Add instructions to artifact
        if: always()
        run: cp benchmarks/README_CI.md benchmarks.log .asv/results/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asv-nightly-results-${{ runner.os }}
          path: .asv/results

      - name: "Job has failed: reporting"
        if: ${{ failure() }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: "nightly benchmark"
        with:
          filename: .github/MAIN_FAIL_TEMPLATE.md
          update_existing: true
