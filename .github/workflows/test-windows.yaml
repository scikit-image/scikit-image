name: Test Windows

on: [push, pull_request, merge_group]

concurrency:
  # Cancel previous workflows of the same PR, but only for PRs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hosted Windows runners intermittently ship an unreadable Tcl install, so
  # matplotlib's default TkAgg backend fails; see gh-8194.
  MPLBACKEND: Agg

jobs:
  build_skimage_windows:
    name: build-windows-cp${{ matrix.python-version }}
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write

    strategy:
      fail-fast: false
      matrix:
        # Build the abi3 wheel once on cp312; the 3.14/3.15 tests reuse it.
        python-version: ["3.12"]

    env:
      CC: ccache clang
      CXX: ccache clang
      CCACHE_DIR: C:\ccache

    steps:
      - name: Checkout scikit-image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version}}
          allow-prereleases: true
          cache-dependency-path: "requirements/*.txt"
          cache: "pip"

      - name: Install build dependencies
        shell: bash
        run: |
          source .github/scripts/setup-build-env.sh

      - name: Install ccache
        shell: bash
        env:
          CCACHE_VERSION: "4.14.2"
          CCACHE_SHA256: "6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84"
        run: |
          name="ccache-${CCACHE_VERSION}-windows-x86_64"
          cd "$RUNNER_TEMP"
          curl -fsSL -O "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${name}.zip"
          set -euo  # Fail below if shasum check of zip archive fails.
          echo "${CCACHE_SHA256}  ${name}.zip" | sha256sum -c -
          unzip -q "${name}.zip"
          echo "$RUNNER_TEMP\\${name}" >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.python-version }}-
            ccache-${{ runner.os }}-

      - name: Zero ccache stats
        shell: bash
        run: ccache --zero-stats

      - name: Build wheel
        shell: bash
        run: |
          # Build the abi3 wheel (the limited API is opt-in).
          python -m build --wheel --no-isolation --skip-dependency-check \
            -Csetup-args="-Dpython.allow_limited_api=true"

      - name: Show ccache stats
        if: always()
        shell: bash
        run: ccache --show-stats

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skimage-windows-abi3
          path: ./dist/*.whl
          if-no-files-found: error

      - name: "Job has failed: reporting"
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: "windows tests"
        with:
          filename: .github/MAIN_FAIL_TEMPLATE.md
          update_existing: true

  test_skimage_windows:
    name: windows-cp${{ matrix.python-version }}-${{ matrix.OPTIONS_NAME }}
    needs: [build_skimage_windows]
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            OPTIONAL_DEPS: 0
            OPTIONS_NAME: "default"
          - python-version: "3.12"
            OPTIONAL_DEPS: 1
            OPTIONS_NAME: "optional-deps"
          - python-version: "3.14"
            OPTIONAL_DEPS: 0
            OPTIONS_NAME: "default"
          - python-version: "3.15"
            OPTIONAL_DEPS: 0
            OPTIONS_NAME: "default"

    steps:
      - name: Checkout scikit-image
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version}}
          allow-prereleases: true
          cache-dependency-path: "requirements/*.txt"
          cache: "pip"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skimage-windows-abi3
          path: ./dist

      - name: Install wheel and spin
        shell: bash
        run: |
          pip install dist/*.whl spin

      - name: Install test dependencies
        env:
          OPTIONAL_DEPS: ${{ matrix.OPTIONAL_DEPS }}
        shell: bash
        run: |
          source .github/scripts/setup-test-env.sh

      - name: Check for run-all-tests label
        id: check-run-all-tests-label
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/check-run-all-tests-label.sh

      - name: Run tests
        shell: bash
        env:
          TEST_MODIFIED: ${{ steps.check-run-all-tests-label.outputs.test_modified }}
        run: |
          if [[ "$TEST_MODIFIED" == "true" ]]; then
            MODIFIED_FLAG="--test-modified"
            git fetch origin "$GITHUB_BASE_REF"
          else
            MODIFIED_FLAG=""
          fi
          spin test --doctest $MODIFIED_FLAG

      - name: Doctest skimage2 migration
        run: |
          python doc/tools/run_migration_doctests.py

      - name: "Job has failed: reporting"
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_TYPE: "windows tests"
        with:
          filename: .github/MAIN_FAIL_TEMPLATE.md
          update_existing: true
